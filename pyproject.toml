[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freqres-pathology"
version = "0.1.0"
description = "Frequency-residual patch-level histopathology classification"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "tqdm>=4.66",
    "h5py>=3.9",
    "torch>=2.0",
    "torchvision>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]
